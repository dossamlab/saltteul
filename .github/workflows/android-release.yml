# Builds the signed Android APK when a version tag (v0.3.0, v0.3.1, ...) is pushed and attaches it to a GitHub
# Release. Phones follow the releases with Obtainium. Screen-only changes do not need a release: the app downloads
# them from the web host (src/pwa/liveUpdate.ts).
#
# Repository secrets:
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#   VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID, VITE_FIREBASE_VAPID_KEY  (Firebase web config)
#   GOOGLE_SERVICES_JSON_BASE64                                                      (android/app/google-services.json)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build screens
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Native project
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          npx cap sync android
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod +x android/gradlew

      - name: Build signed APK
        working-directory: android
        env:
          SALTTEUL_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SALTTEUL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SALTTEUL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SALTTEUL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SALTTEUL_VERSION_CODE: ${{ github.run_number }}
        run: |
          export SALTTEUL_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export SALTTEUL_VERSION_CODE=$((SALTTEUL_VERSION_CODE + 2))
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "saltteul-${VERSION}.apk"
          gh release create "$GITHUB_REF_NAME" "saltteul-${VERSION}.apk" \
            --title "살뜰 ${VERSION}" --notes "안드로이드 앱 ${VERSION}. Obtainium으로 이 저장소를 추가하면 새 버전을 알려 줍니다."
